name: Bug report
description: Something in the ledger isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ledger serve --demo
        2. POST /v1/events with ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ledger version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - pip
        - Docker
        - from source
    validations:
      required: true
