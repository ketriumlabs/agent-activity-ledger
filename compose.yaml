services:
  ledger:
    build: .
    image: ghcr.io/ketriumlabs/agent-activity-ledger:latest
    ports:
      - "8420:8420"
    environment:
      - LEDGER_HOST=0.0.0.0
      # Defaults to demo mode so `docker compose up` matches the README
      # quickstart's `docker run -e DEMO=1 ...` one-liner. Run a real
      # instance with `DEMO=0 docker compose up`.
      - DEMO=${DEMO:-1}
      # - LEDGER_SMTP_HOST=smtp.example.com
      # - LEDGER_SMTP_USER=
      # - LEDGER_SMTP_PASSWORD=
      # - LEDGER_DIGEST_TO=
    volumes:
      - ledger-data:/data

volumes:
  ledger-data:
