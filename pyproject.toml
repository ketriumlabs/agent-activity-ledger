[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-activity-ledger"
version = "0.1.0"
description = "A self-hosted bank statement for everything your AI agents did on your behalf."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Ketrium Labs" }]
keywords = ["ai-agents", "audit-log", "observability", "self-hosted", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "apscheduler>=3.10",
  "argon2-cffi>=23.1",
  "typer>=0.13",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
mcp = ["mcp>=1.1"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "hypothesis>=6.115",
  "schemathesis>=3.39",
  "mypy>=1.13",
  "ruff>=0.7",
  "pre-commit>=4.0",
  "jsonschema[format]>=4.23",
]

[project.scripts]
ledger = "ledger.cli:app"
ledger-mcp = "ledger.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ledger"]

[[tool.mypy.overrides]]
# Both are optional-extra integrations (mcp, apscheduler); neither ships
# inline types or stubs, and neither is a core dependency worth blocking on.
module = ["apscheduler.*", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ledger.mcp.server decorates with mcp's untyped @server.tool() — see above.
module = ["ledger.mcp.server"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/ledger/core", "src/ledger/store"]
